name: github-actions
version: 0.0.1
description: Reviews GitHub Actions workflows for security, supply-chain, and reliability defects.

triggers:
  manual: true
  files_changed:
    - ".github/workflows/*.yml"
    - ".github/workflows/*.yaml"

runtime:
  name: node
  version: "22"
  command:
    - dist/index.js

permissions:
  enforcement: advisory
  filesystem:
    read:
      - .
    write:
      - .adversary/results
  network: false
  environment:
    allow: []

findings:
  format: adversary.review.v1
